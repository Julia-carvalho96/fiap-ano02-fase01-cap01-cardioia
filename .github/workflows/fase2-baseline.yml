name: Validar Fase 2

on:
  push:
    branches:
      - fase-2-machine-learning
    paths:
      - "fase2/**"
      - "assets/dados/processed/heart_disease_cleveland.csv"
      - ".github/workflows/fase2-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fase2/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r fase2/requirements.txt

      - name: Verificar sintaxe
        run: |
          python -m py_compile fase2/app.py
          python -m py_compile fase2/src/treinar_baselines.py
          python -m py_compile fase2/src/analisar_modelo.py
          python -m py_compile fase2/tests/test_app.py

      - name: Testar inicialização do front
        run: |
          streamlit run fase2/app.py --server.headless true --server.port 8501 > /tmp/cardioia-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep --quiet ok; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cardioia-streamlit.log
          exit 1

      - name: Testar envio da simulação
        run: python fase2/tests/test_app.py

      - name: Executar treinamento
        run: python fase2/src/treinar_baselines.py

      - name: Executar análise estatística e visual
        run: python fase2/src/analisar_modelo.py

      - name: Executar notebook
        run: |
          jupyter nbconvert --to notebook --execute fase2/notebooks/analise_baseline.ipynb --output-dir fase2/resultados --output analise_baseline_executada.ipynb --ExecutePreprocessor.timeout=300

      - name: Conferir saídas obrigatórias
        run: |
          test -s fase2/resultados/metricas_validacao_cruzada.csv
          test -s fase2/resultados/metricas_teste.csv
          test -s fase2/resultados/metricas_por_sexo.csv
          test -s fase2/resultados/previsoes_teste.csv
          test -s fase2/resultados/metadados_execucao.json
          test -s fase2/resultados/melhor_modelo.joblib
          test -s fase2/resultados/intervalos_confianca_bootstrap.csv
          test -s fase2/resultados/importancia_variaveis.csv
          test -s fase2/resultados/graficos/matriz_confusao.png
          test -s fase2/resultados/graficos/curva_roc.png
          test -s fase2/resultados/graficos/curva_precisao_recall.png
          test -s fase2/resultados/graficos/curva_calibracao.png
          test -s fase2/resultados/graficos/distribuicao_alvo_por_sexo.png
          test -s fase2/resultados/graficos/importancia_variaveis.png
          test -s fase2/resultados/analise_baseline_executada.ipynb
