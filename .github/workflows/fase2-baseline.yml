name: Validar baseline da Fase 2

on:
  push:
    branches:
      - fase-2-machine-learning
    paths:
      - "fase2/**"
      - "assets/dados/processed/heart_disease_cleveland.csv"
      - ".github/workflows/fase2-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fase2/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r fase2/requirements.txt

      - name: Verificar sintaxe
        run: python -m py_compile fase2/src/treinar_baselines.py

      - name: Executar treinamento
        run: python fase2/src/treinar_baselines.py

      - name: Conferir saídas obrigatórias
        run: |
          test -s fase2/resultados/metricas_validacao_cruzada.csv
          test -s fase2/resultados/metricas_teste.csv
          test -s fase2/resultados/metricas_por_sexo.csv
          test -s fase2/resultados/previsoes_teste.csv
          test -s fase2/resultados/metadados_execucao.json
          test -s fase2/resultados/melhor_modelo.joblib

      - name: Exibir resumo das métricas
        run: |
          echo "=== Validação cruzada ==="
          cat fase2/resultados/metricas_validacao_cruzada.csv
          echo "=== Teste ==="
          cat fase2/resultados/metricas_teste.csv
          echo "=== Desempenho por sexo ==="
          cat fase2/resultados/metricas_por_sexo.csv

      - name: Disponibilizar resultados da execução
        uses: actions/upload-artifact@v4
        with:
          name: resultados-baseline-fase2
          path: fase2/resultados/
          if-no-files-found: error
